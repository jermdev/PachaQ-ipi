<section class="view-alerta" aria-label="Alerta Sísmica Temprana" aria-live="assertive">
  <div class="view-alerta__container">
    
    <!-- Bloque superior y central -->
    <div class="view-alerta__content">
      
      <!-- Etiqueta superior -->
      <header class="view-alerta__badge">
        <svg class="view-alerta__icon-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
        </svg>
        <span>ALERTA SÍSMICA TEMPRANA</span>
      </header>

      <!-- Ondas concéntricas / Radar -->
      <figure class="view-alerta__radar" aria-hidden="true">
        <span class="view-alerta__ring view-alerta__ring--outer"></span>
        <span class="view-alerta__ring view-alerta__ring--middle"></span>
        <span class="view-alerta__ring view-alerta__ring--inner"></span>
        <svg class="view-alerta__radar-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
        </svg>
      </figure>

      <!-- Magnitud y cuenta regresiva -->
      <div class="view-alerta__info">
        <p class="view-alerta__magnitude">Mag. 6.2</p>
        <time class="view-alerta__countdown" datetime="PT10S">10 seg</time>
        <p class="view-alerta__wave">Onda S en llegada</p>
      </div>

      <!-- Aviso principal -->
      <aside class="view-alerta__instruction" role="alert">
        <h2 class="view-alerta__instruction-text">¡UBÍCATE EN TU ZONA SEGURA INMEDIATAMENTE!</h2>
      </aside>

      <!-- Indicadores activos -->
      <ul class="view-alerta__pills" aria-label="Modos de notificación activos">
        <li class="view-alerta__pill">
          <svg class="view-alerta__icon-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
          <span>Sonido</span>
        </li>
        <li class="view-alerta__pill">
          <svg class="view-alerta__icon-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M0 15h2V9H0v6zm3 2h2V7H3v10zm19-8v6h2V9h-2zm-3 8h2V7h-2v10zM16.5 3h-9C6.67 3 6 3.67 6 4.5v15c0 .83.67 1.5 1.5 1.5h9c.83 0 1.5-.67 1.5-1.5v-15c0-.83-.67-1.5-1.5-1.5zM16 19H8V5h8v14z"/>
          </svg>
          <span>Vibración</span>
        </li>
        <li class="view-alerta__pill">
          <svg class="view-alerta__icon-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
          <span>Voz</span>
        </li>
      </ul>

    </div>

    <!-- Navegación hacia la siguiente vista -->
    <footer class="view-alerta__footer">
      <a href="#zona-segura" data-route="zona-segura" class="view-alerta__cta">
        <svg class="view-alerta__icon-md" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <span>Ver mi zona segura</span>
      </a>
    </footer>

  </div>
</section>
