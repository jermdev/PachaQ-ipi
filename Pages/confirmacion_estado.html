<link rel="stylesheet" href="../CSS/styles.css">
<link rel="stylesheet" href="../CSS/confirmacion_estado.css">

<section class="view-confirmacion" aria-label="Confirmación de estado tras el sismo">
  <div class="view-confirmacion__container">
    
    <!-- Bloque superior: icono, mensaje y aviso de GPS -->
    <div class="view-confirmacion__content">
      
      <!-- Escudo con check -->
      <figure class="view-confirmacion__shield-badge" aria-hidden="true">
        <svg class="view-confirmacion__shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </figure>

      <!-- Título y descripción -->
      <header class="view-confirmacion__header">
        <h2 class="view-confirmacion__title">El movimiento telúrico ha finalizado</h2>
        <p class="view-confirmacion__subtitle">Confirma tu estado para notificar de inmediato a tu grupo familiar.</p>
      </header>

      <!-- Tarjeta informativa de ubicación -->
      <aside class="view-confirmacion__gps-notice">
        <svg class="view-confirmacion__gps-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <p class="view-confirmacion__gps-text">Se enviará tu ubicación GPS actual junto con tu estado.</p>
      </aside>

    </div>

    <!-- Bloque inferior: acciones navegables -->
    <footer class="view-confirmacion__actions" aria-label="Opciones de reporte de estado">
      <a href="#estado-bien" data-route="estado-bien" data-status="safe" class="view-confirmacion__btn view-confirmacion__btn--safe">
        <svg class="view-confirmacion__btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span>¡ESTOY BIEN!</span>
      </a>

      <a href="#necesito-ayuda" data-route="necesito-ayuda" data-status="sos" class="view-confirmacion__btn view-confirmacion__btn--sos">
        <span class="view-confirmacion__sos-badge" aria-hidden="true">SOS</span>
        <span>NECESITO AYUDA</span>
      </a>
    </footer>

  </div>
</section>
