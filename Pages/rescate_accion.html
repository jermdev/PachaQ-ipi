<link rel="stylesheet" href="../CSS/styles.css">
<link rel="stylesheet" href="../CSS/rescate_accion.css">

<section class="view-rescate" aria-label="Baliza SOS activada" aria-live="assertive">
  <div class="view-rescate__container">
    
    <!-- Bloque superior y central -->
    <div class="view-rescate__content">
      
      <!-- Baliza SOS con ondas concéntricas -->
      <figure class="view-rescate__beacon" aria-hidden="true">
        <span class="view-rescate__ring view-rescate__ring--outer"></span>
        <span class="view-rescate__ring view-rescate__ring--middle"></span>
        <span class="view-rescate__ring view-rescate__ring--inner"></span>
        <span class="view-rescate__sos-core">SOS</span>
      </figure>

      <!-- Título y descripción -->
      <header class="view-rescate__header">
        <h2 class="view-rescate__title">BALIZA SOS ACTIVADA</h2>
        <p class="view-rescate__subtitle">Emitiendo destellos de flash y alarma acústica para el rescate.</p>
      </header>

      <!-- Píldoras de estado de la baliza -->
      <ul class="view-rescate__pills" aria-label="Funciones de rescate activas">
        <li class="view-rescate__pill">
          <svg class="view-rescate__icon-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
          </svg>
          <span>Flash</span>
        </li>
        <li class="view-rescate__pill">
          <svg class="view-rescate__icon-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
          <span>Sonido agudo</span>
        </li>
        <li class="view-rescate__pill">
          <svg class="view-rescate__icon-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <span>GPS enviado</span>
        </li>
      </ul>

      <!-- Tarjeta de contacto a emergencias -->
      <aside class="view-rescate__emergency-card" role="region" aria-label="Central de emergencias">
        <h3 class="view-rescate__emergency-label">CONTACTO A CENTRAL DE EMERGENCIAS</h3>
        <p class="view-rescate__emergency-status">Llamando a Bomberos (116) y Policía (105)…</p>
        
        <div class="view-rescate__call-grid">
          <a href="tel:116" class="view-rescate__call-btn">
            <svg class="view-rescate__icon-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2z"/>
            </svg>
            <span>Llamar 116</span>
          </a>

          <a href="tel:105" class="view-rescate__call-btn">
            <svg class="view-rescate__icon-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2z"/>
            </svg>
            <span>Llamar 105</span>
          </a>
        </div>
      </aside>

      <!-- Indicador de batería y ahorro -->
      <p class="view-rescate__battery-status">Batería 34% · Modo ahorro activo</p>

    </div>

    <!-- Acción inferior para desactivar y volver -->
    <footer class="view-rescate__footer">
      <a href="#confirmacion-estado" data-route="confirmacion-estado" data-action="deactivate-sos" class="view-rescate__deactivate-btn">
        Desactivar baliza SOS
      </a>
    </footer>

  </div>
</section>
