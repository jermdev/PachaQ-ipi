<link rel="stylesheet" href="../CSS/styles.css">
<link rel="stylesheet" href="../CSS/estados_familiares.css">

<section class="view-estados" aria-label="Confirmación de notificación familiar">
  <div class="view-estados__container">
    
    <!-- Bloque superior: confirmación y lista de familiares -->
    <div class="view-estados__content">
      
      <!-- Icono principal de éxito -->
      <figure class="view-estados__check-badge" aria-hidden="true">
        <svg class="view-estados__check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </figure>

      <!-- Título -->
      <header class="view-estados__header">
        <h2 class="view-estados__title">¡Notificación enviada!</h2>
      </header>

      <!-- Aviso de envío de coordenadas -->
      <aside class="view-estados__alert" role="status">
        <svg class="view-estados__alert-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <p class="view-estados__alert-text">Tu grupo familiar ha recibido tu estado de bienestar junto con tus coordenadas GPS actuales.</p>
      </aside>

      <!-- Lista de estado de lectura por familiar -->
      <ul class="view-estados__family-list" aria-label="Estado de recepción del grupo familiar">
        
        <li class="view-estados__member">
          <span class="view-estados__avatar" aria-hidden="true">JQ</span>
          <div class="view-estados__member-info">
            <span class="view-estados__member-name">Joquer</span>
            <span class="view-estados__member-meta">Visto <time datetime="10:01">10:01</time></span>
          </div>
          <span class="view-estados__status view-estados__status--received">
            <svg class="view-estados__status-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <span>Recibido</span>
          </span>
        </li>

        <li class="view-estados__member">
          <span class="view-estados__avatar" aria-hidden="true">MA</span>
          <div class="view-estados__member-info">
            <span class="view-estados__member-name">María</span>
            <span class="view-estados__member-meta">Entregado</span>
          </div>
          <span class="view-estados__status view-estados__status--unread">
            <svg class="view-estados__status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>Sin leer</span>
          </span>
        </li>

      </ul>

    </div>

    <!-- Acción inferior para navegar al mapa -->
    <footer class="view-estados__footer">
      <a href="#mapa-familiar" data-route="mapa-familiar" class="view-estados__cta">
        <span>Ver mapa familiar</span>
        <span aria-hidden="true">→</span>
      </a>
    </footer>

  </div>
</section>
